<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Confirmed | SnackCart</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    @keyframes pop {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      70% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    .success-icon {
      animation: pop 0.7s ease-out forwards;
    }

    .fade-up {
      animation: fadeUp 0.7s ease-out forwards;
    }

    .float {
      animation: float 3s ease-in-out infinite;
    }
  </style>
</head>

<body
  class="min-h-screen bg-gradient-to-br from-orange-50 via-white to-amber-100 flex items-center justify-center px-4">

  <!-- Decorative floating emojis -->
  <div class="absolute top-20 left-10 text-4xl float opacity-70">
    🍔
  </div>

  <div class="absolute bottom-24 right-10 text-4xl float opacity-70">
    🍟
  </div>

  <div class="absolute top-32 right-20 text-3xl float opacity-60">
    🥤
  </div>

  <!-- Main Card -->
  <main
    class="w-full max-w-lg bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white p-8 sm:p-10 text-center">

    <!-- Success Icon -->
    <div class="success-icon mx-auto w-24 h-24 rounded-full bg-green-100 flex items-center justify-center shadow-inner">

      <div class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center shadow-lg">
        <span class="text-4xl text-white">
          ✓
        </span>
      </div>

    </div>


    <!-- Heading -->
    <div class="fade-up mt-7">

      <p class="text-sm font-semibold tracking-widest text-orange-500 uppercase">
        SnackCart
      </p>

      <h1 class="mt-2 text-4xl sm:text-5xl font-extrabold text-slate-900">
        Order Confirmed!
      </h1>

      <p class="mt-4 text-slate-500 text-base sm:text-lg leading-relaxed">
        Your cravings are officially on their way! 🍔🍟
      </p>

    </div>


    <!-- Order Details -->
    <!-- What's Next -->
    <div class="fade-up mt-8 rounded-2xl bg-slate-50 border border-slate-200 p-5 text-left">

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-xl">
          👨‍🍳
        </div>

        <div>
          <p class="font-bold text-slate-800">
            Your order is being prepared
          </p>

          <p class="text-sm text-slate-500 mt-0.5">
            Our kitchen is getting your snacks ready!
          </p>
        </div>
      </div>

      <div class="h-px bg-slate-200 my-5"></div>

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-xl">
          🚴
        </div>

        <div>
          <p class="font-bold text-slate-800">
            Almost on the way
          </p>

          <p class="text-sm text-slate-500 mt-0.5">
            Sit back, relax and get ready to enjoy! 😋
          </p>
        </div>
      </div>

    </div>


    <!-- Message -->
    <p class="fade-up mt-6 text-sm text-slate-500">
      Thanks for choosing SnackCart.
      <br>
      Enjoy your meal! 😋
    </p>


    <!-- Continue Shopping -->
    <a href="index.html">
      <button id="continueShopping"
        class="fade-up mt-8 w-full py-3.5 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-200 hover:bg-orange-600 hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-200">

        Continue Shopping 🛒

      </button>
    </a>


  </main>
  <script src="index.js"></script>
</body>

</html>
